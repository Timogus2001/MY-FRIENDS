<!DOCTYPE html>
<html lang="en">
<head>
  <style>

    .card {
      width: 280px;
      background-color: white;
      border: 2px solid black;
      border-radius: 15px;
      padding: 20px;
      margin: 40px auto;
      box-shadow: 0 4px 10px orange;
      text-align: center;
    }
    .card img {
      border-radius: 10px;
    }
    .card p {
      font-size: 16px;
      color: #555;
    }

    </style>
</head>
<body>
  <div class="card">
    <img src="https://placehold.co/280x180">
    <p>
      Это карточка с картинкой, заголовком, описанием и кнопкой.
    </p>
      </div>
</body>
