<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gaming Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      color: #FFFFFF;
    }

    header {
      text-align: center;
      font-size: 3rem;
      color: #FBBC04;
      text-shadow: 0 0 10px #FEEFC3;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
    }

    .profile-img {
      width: 700px;
      max-width: 75vw;
      border-radius: 12px;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }

    .text {
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.6);
      padding: 30px;
      border-radius: 12px;
    }

    h2 {
      color: #FBBC04;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    p {
      font-size: 1.75rem;
      line-height: 1.8;
      color: #202124;
    }

    p2 {
      font-size: 1rem;
      line-height: 1.8;
      color: #202124;
      display: block;
      margin: 10px 0;
    }

    a:visited {
      color: yellow;
    }

    a:hover {
      color: yellow;
    }

    a:active {
      color: yellow;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin-top: 20px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .card {
      background: rgba(2, 6, 23, 0.8);
      border: 2px solid #FBBC04;
      padding: 20px;
      border-radius: 12px;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 0 25px #FEEFC3;
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 0.55rem;
      color: #64748b;
    }

    @media (max-width: 600px) {
      header {
        font-size: 0.9rem;
      }

      p {
        font-size: 0.6rem;
      }
    }
  </style>
</head>

<body>

<header>
  <br>
  👑 Killstreaker 👑
</header>

<section class="container">
  <img src="https://i1.sndcdn.com/artworks-iVkNLLsezX67N9vE-eNijVg-t1080x1080.jpg" alt="My Image" class="profile-img">

  <div class="text">
    <h2>About Me</h2>
    <p>
      Yo! I'm Killstreaker — a gamer, builder, and creative mind who loves Minecraft-style worlds and cool projects.
    </p>
    <p>
      I enjoy designing, exploring, and leveling up my skills 🚀
    </p>
  </div>
</section>

<section class="section">
  <div class="cards">
     <a href="https://timogus2001.github.io/MY-FRIENDS/">
    <div class="card">Home</div>
  </div>
</section>

<section class="section">
  <h2>📬 Contact</h2>

  <p2>
    <a href="http://discordapp.com/users/1229062446858244257">
      Discord: timogus2001
    </a>
  </p2>
  <p2>
    <a href="https://github.com/Timogus2001">
      GitHub: Timogus2001
    </a>
  </p2>
  <p2>Telegram: @timannenkov</p2>
</section>

</body>
</html>
