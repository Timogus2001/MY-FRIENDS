<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gaming Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f2f2f2;
      font-family: 'Press Start 2P', cursive;
    }

    .container {
      max-width: 1500px;
      margin: 20px auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    header {
      text-align: center;
      font-size: 3rem;
      color: #FBBC04;
      text-shadow: 0 0 10px #FEEFC3;
      margin-bottom: 30px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 20px;
    }

    .profile-img {
      width: 500px;
      max-width: 100%;
      border-radius: 15px;
    }

    .text {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.7);
      padding: 25px;
      border-radius: 12px;
    }

    h2 {
      color: #FBBC04;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }

    p {
      font-size: 1.3rem;
      line-height: 1.8;
      color: #202124;
    }

    .small-text {
      font-size: 1.1rem;
      color: #202124;
      margin: 8px 0;
    }

    .section {
      padding: 30px 20px;
      text-align: center;
    }

    .button {
      background-color: #E37400;
      color: white;

      padding: 15px 30px;
      border: none;
      border-radius: 10px;

      font-size: 20px;
      cursor: pointer;

      transition: 0.3s;

      display: block;
      margin: 30px auto;
    }

    .button:hover {
      background-color: #FBBC04;
    }

    /* 🔶 ALL LINKS = ORANGE */
    a {
      color: #FBBC04 !important;
      text-decoration: none;
      text-shadow: 0 0 6px #FBBC04;
    }

    a:visited,
    a:hover,
    a:active {
      color: orange !important;
      text-shadow: 0 0 10px orange;
    }

    @media (max-width: 900px) {
      .hero {
        flex-direction: column;
      }
    }

    @media (max-width: 600px) {
      header {
        font-size: 1.5rem;
      }

      p {
        font-size: 0.9rem;
      }

      .small-text {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    👑 Killstreaker 👑
  </header>

  <section class="hero">
    <img src="https://i1.sndcdn.com/artworks-iVkNLLsezX67N9vE-eNijVg-t1080x1080.jpg" class="profile-img">

    <div class="text">
      <h2>About Me</h2>
      <p>Yo! I'm Killstreaker — a gamer, builder, and creative mind.</p>
      <p>I enjoy designing, exploring, and leveling up 🚀</p>
    </div>
  </section>

<a href="https://timogus2001.github.io/MY-FRIENDS/">
  <button class="button">Наведи на меня</button>
</a>

  <section class="section">
    <h2>📬 Contact</h2>

    <p class="small-text">
      <a href="http://discordapp.com/users/1229062446858244257">
        Discord: timogus2001
      </a>
    </p>

    <p class="small-text">
      <a href="https://github.com/Timogus2001">
        GitHub: Timogus2001
      </a>
    </p>

    <p class="small-text">
      Telegram: @timannenkov
    </p>
  </section>

</div>

</body>
</html>
